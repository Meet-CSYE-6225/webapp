name: Build Artifact and Run Packer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5432:5432"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: "localhost"
          DB_PORT: ${{ secrets.DB_PORT }}
          PORT: "8080"
          NODE_ENV: test
        run: npm test

      - name: Build Application Artifact
        run: |
          echo "Creating zip artifact..."
          zip -r "${{ secrets.ARTIFACT_PATH }}" . -x "node_modules/*" ".git/*"
          ls -l "${{ secrets.ARTIFACT_PATH }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-zip
          path: ${{ secrets.ARTIFACT_PATH }}

  packer-build:
    runs-on: ubuntu-latest
    needs: build-artifact
    env:
      PACKER_INSTANCE_TYPE: ${{ secrets.PACKER_INSTANCE_TYPE }}
      PACKER_AMI_NAME: ${{ secrets.PACKER_AMI_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ARTIFACT_PATH: ${{ secrets.ARTIFACT_PATH }}
      # GCP environment variables (stored as GitHub secrets)
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_MACHINE_TYPE: ${{ secrets.GCP_MACHINE_TYPE }}
      GCP_IMAGE_NAME: ${{ secrets.GCP_IMAGE_NAME }}
      GCP_SOURCE_IMAGE_FAMILY: ${{ secrets.GCP_SOURCE_IMAGE_FAMILY }}
      GCP_SOURCE_IMAGE_PROJECT_ID: ${{ secrets.GCP_SOURCE_IMAGE_PROJECT_ID }}
      GCP_DISK_TYPE: ${{ secrets.GCP_DISK_TYPE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-zip
          path: .

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup GCP CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2

      - name: List Repository Files
        run: ls -la

      - name: Build Custom Image with Packer
        run: |
          packer init .
          packer validate csye-6225.pkr.hcl
          packer build \
            -var "artifact_path=${{ secrets.ARTIFACT_PATH }}" 
            -var "instance_type=${{ secrets.PACKER_INSTANCE_TYPE }}" 
            -var "ami_name=${{ secrets.PACKER_AMI_NAME }}" 
            -var "aws_region=${{ secrets.AWS_REGION }}" 
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" 
            -var "gcp_zone=${{ secrets.GCP_ZONE }}" 
            -var "gcp_machine_type=${{ secrets.GCP_MACHINE_TYPE }}" 
            -var "gcp_image_name=${{ secrets.GCP_IMAGE_NAME }}" 
            -var "gcp_source_image_family=${{ secrets.GCP_SOURCE_IMAGE_FAMILY }}" \
            -var "gcp_source_image_project_id=${{ secrets.GCP_SOURCE_IMAGE_PROJECT_ID }}" 
            -var "gcp_disk_type=${{ secrets.GCP_DISK_TYPE }}" 
            csye-6225.pkr.hcl
