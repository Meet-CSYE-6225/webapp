name: Build Artifact and Run Packer

on:
  push:
    branches:
      - main

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: "postgres"
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Application Artifact
        run: |
          echo "Zipping repository into webapp.zip"
          zip -r webapp.zip . -x "node_modules/*" "*.git*"
          ls -l webapp.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-zip
          path: webapp.zip

  packer-build:
    runs-on: ubuntu-latest
    needs: build-artifact
    env:
      PACKER_INSTANCE_TYPE: ${{ secrets.PACKER_INSTANCE_TYPE }}
      PACKER_AMI_NAME: ${{ secrets.PACKER_AMI_NAME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: webapp-zip
          path: .

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2

      - name: List Repository Files
        run: ls -la

      - name: Build Custom Image with Packer
        run: |
          packer init .
          packer validate csye-6225-aws.pkr.hcl
          packer build -var "artifact_path=webapp.zip" -var "instance_type=${PACKER_INSTANCE_TYPE}" -var "ami_name=${PACKER_AMI_NAME}" csye-6225-aws.pkr.hcl
