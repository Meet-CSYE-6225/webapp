name: Build Artifact and Run Packer

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    
    
    
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5432:5432"
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NODE_ENV: test
      CI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Dependencies
        run: npm install

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U $DB_USER; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        env:
          DB_NAME: health_check_db
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          PORT: 8080
          NODE_ENV: test
        run: npm test

      - name: Build application artifact
        run: zip -r webapp.zip . -x "*.git*" "node_modules/*" "*.env" "*.zip"

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v1
      #   with:
      #     credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # - name: Setup GCP CLI
      #   uses: google-github-actions/setup-gcloud@v1
      #   with:
      #     project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2

      - name: Build Custom Images with Packer
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS is set to: $GOOGLE_APPLICATION_CREDENTIALS"
          ls -l $GOOGLE_APPLICATION_CREDENTIALS
          packer init .
          packer validate csye-6225.pkr.hcl
          packer build \
            -var "ami_name=${{ secrets.PACKER_AMI_NAME }}" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "gcp_zone=${{ secrets.GCP_ZONE }}" \
            -var "gcp_destination_project_id=${{ secrets.GCP_DESTINATION_PROJECT_ID }}" \
            csye-6225.pkr.hcl
      - name: Share AMI with Dev and Demo Accounts
        run: |
              AMI_NAME_PATTERN="csye-*"
              echo "Looking up latest AMI with name pattern: ${AMI_NAME_PATTERN}"
              
              AMI_ID=$(aws ec2 describe-images --owners self --filters "Name=name,Values=${AMI_NAME_PATTERN}" --query 'Images[-1].ImageId' --output text)
              
              if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "None" ]; then
                echo "Error: No AMI found with name pattern ${AMI_NAME_PATTERN}"
                exit 1
              fi
              
              echo "Found AMI_ID: $AMI_ID"
              
              aws ec2 modify-image-attribute --image-id $AMI_ID --launch-permission "{\"Add\":[{\"UserId\":\"${{ secrets.AWS_ACCOUNT_ID_DEV }}\"}, {\"UserId\":\"${{ secrets.AWS_ACCOUNT_ID_DEMO }}\"}]}"
      - name: Create New Launch Template Version
        run: |
                AMI_NAME_PATTERN="csye-*"
                echo "Looking up latest AMI with name pattern: ${AMI_NAME_PATTERN}"
            
                LATEST_AMI_ID=$(aws ec2 describe-images --owners self \
                  --filters "Name=name,Values=${AMI_NAME_PATTERN}" \
                  --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
                  --output text)
            
                if [[ -z "$LATEST_AMI_ID" || "$LATEST_AMI_ID" == "None" ]]; then
                  echo "Error: No AMI found with name pattern ${AMI_NAME_PATTERN}"
                  exit 1
                fi
            
                echo "Using AMI: $LATEST_AMI_ID"
            
                # Find latest Launch Template that starts with "csye-"
                LT_NAME=$(aws ec2 describe-launch-templates \
                  --query "LaunchTemplates[?starts_with(LaunchTemplateName, 'csye-')].LaunchTemplateName" \
                  --output text | head -n 1)
            
                if [[ -z "$LT_NAME" ]]; then
                  echo "Error: No Launch Template found with prefix 'csye-'"
                  exit 1
                fi
            
                echo "Launch Template Name: $LT_NAME"
            
                LAUNCH_TEMPLATE_ID=$(aws ec2 describe-launch-templates \
                  --filters "Name=launch-template-name,Values=$LT_NAME" \
                  --query "LaunchTemplates[0].LaunchTemplateId" \
                  --output text)
            
                if [[ -z "$LAUNCH_TEMPLATE_ID" ]]; then
                  echo "Error: Could not find Launch Template ID for $LT_NAME"
                  exit 1
                fi
            
                echo "Launch Template ID: $LAUNCH_TEMPLATE_ID"
            
                aws ec2 create-launch-template-version \
                  --launch-template-id "$LAUNCH_TEMPLATE_ID" \
                  --source-version 1 \
                  --version-description "New AMI version from CI" \
                  --launch-template-data "{\"ImageId\":\"$LATEST_AMI_ID\"}"
            
            
            


      - name: Start Instance Refresh
        run: |
                    ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
                      --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'asg')].AutoScalingGroupName" \
                      --output text)
          
                    REFRESH_ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name $ASG_NAME \
                      --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":300}' \
                      --query 'InstanceRefreshId' --output text)
          
                    echo "Started refresh: $REFRESH_ID"
          
                    while true; do
                      STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG_NAME \
                        --query "InstanceRefreshes[?InstanceRefreshId=='$REFRESH_ID'].Status" --output text)
          
                      echo "Current Refresh Status: $STATUS"
                      if [[ "$STATUS" == "Successful" || "$STATUS" == "Cancelled" || "$STATUS" == "Failed" ]]; then
                        break
                      fi
                      sleep 30
                    done
          
                    if [[ "$STATUS" != "Successful" ]]; then
                      echo "Instance refresh failed or was cancelled."
                      exit 1
                    fi
                    
                
                  
